name: Build KYBER diagnostic DLL

on:
  push:
    branches:
      - debug/crossover-pid-diagnostics
    paths:
      - "maxima-lib/src/lsx/connection.rs"
      - ".github/workflows/build-crossover-diagnostic-dll.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-dll:
    name: Build rust_lib.dll with beta10.1-pinned dependencies
    runs-on: windows-latest
    steps:
      - name: Check out this Maxima fork (diagnostic source)
        uses: actions/checkout@v4
        with:
          path: maxima-source

      - name: Check out exact KYBER beta10.1 source
        uses: actions/checkout@v4
        with:
          repository: ArmchairDevelopers/Kyber
          # Immutable commit for the beta10.1 tree, including its submodule gitlink.
          ref: 920dcc247b638f711402209155d7748cd55979ec
          path: kyber-source
          submodules: true
          fetch-depth: 1

      - name: Verify pinned Maxima submodule and overlay diagnostic file only
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $maximaSource = Join-Path $workspace "maxima-source"
          $maximaDestination = Join-Path $workspace "kyber-source\ThirdParty\Maxima"
          $expectedMaximaCommit = "478d720da19efc335d85b7204eb2eba00a5e207c"
          $actualMaximaCommit = (git -C $maximaDestination rev-parse HEAD).Trim()

          Write-Host "KYBER commit:"
          git -C (Join-Path $workspace "kyber-source") rev-parse HEAD
          Write-Host "Maxima submodule commit: $actualMaximaCommit"

          if ($actualMaximaCommit -ne $expectedMaximaCommit) {
            throw "Unexpected Maxima submodule commit. Expected $expectedMaximaCommit; got $actualMaximaCommit"
          }

          $patchedFile = Join-Path $maximaSource "maxima-lib\src\lsx\connection.rs"
          $destinationFile = Join-Path $maximaDestination "maxima-lib\src\lsx\connection.rs"

          if (-not (Test-Path $patchedFile)) {
            throw "Diagnostic source file not found: $patchedFile"
          }
          if (-not (Test-Path $destinationFile)) {
            throw "Pinned Maxima connection.rs not found: $destinationFile"
          }

          Copy-Item -LiteralPath $patchedFile -Destination $destinationFile -Force

          # Print a small provenance summary so the artifact is traceable.
          Write-Host "Applied only the diagnostic connection.rs change; all other Maxima files stay at $expectedMaximaCommit."

      - name: Install KYBER beta10.1 Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-04-06

      - name: Verify Rust compiler version
        shell: pwsh
        run: rustc +nightly-2026-04-06 --version --verbose

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "kyber-source/Launcher/rust -> target"
          shared-key: windows-kyber-diagnostic-dll-nightly-2026-04-06

      - name: Work around yanked crates.io zip 2.4.2 for diagnostic build
        shell: pwsh
        run: |
          # KYBER beta10.1 pins zip 2.4.2, but crates.io currently marks that
          # version yanked and Launcher/rust/Cargo.lock is intentionally ignored.
          # Use the upstream immutable source tag for the same 2.4.2 release
          # only in this temporary CI checkout; don't alter the user's repo source.
          $manifest = Join-Path $env:GITHUB_WORKSPACE "kyber-source\Launcher\rust\Cargo.toml"
          $text = Get-Content -LiteralPath $manifest -Raw
          $needle = "flate2 = { git = 'https://github.com/ArmchairDevelopers/flate2-rs.git' }"
          $patch = $needle + "`nzip = { git = 'https://github.com/zip-rs/zip2.git', tag = 'v2.4.2' }"

          if (-not $text.Contains($needle)) {
            throw "Could not find expected [patch.crates-io] insertion point in Launcher/rust/Cargo.toml"
          }
          if ($text.Contains("zip = { git = 'https://github.com/zip-rs/zip2.git'")) {
            throw "zip git patch already exists; refusing to apply it twice"
          }

          Set-Content -LiteralPath $manifest -Value ($text.Replace($needle, $patch)) -NoNewline -Encoding utf8

      - name: Build KYBER Rust DLL
        shell: pwsh
        run: |
          cargo +nightly-2026-04-06 build --release --manifest-path "$env:GITHUB_WORKSPACE\kyber-source\Launcher\rust\Cargo.toml"

          $dll = Join-Path $env:GITHUB_WORKSPACE "kyber-source\Launcher\rust\target\release\rust_lib.dll"
          if (-not (Test-Path $dll)) {
            throw "Build completed but rust_lib.dll was not found at $dll"
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lib-dll-crossover-pid-diagnostics
          path: kyber-source/Launcher/rust/target/release/rust_lib.dll
          if-no-files-found: error
          retention-days: 14
